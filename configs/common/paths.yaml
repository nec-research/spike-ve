# Shared data paths for the RECOMB 2027 configs.
#
# A config takes these values by adding a line such as
#   _base_: ../../common/paths.yaml      (path relative to the config file)
# and loads itself with recomb2027.config_io.load_config(). Any key the config sets itself overrides
# the value here (the predictor configs set their own `root`, for example).
#
# To move the data, change the values in this file, or let scripts/common.sh do it: it asks for the cluster data
# root (`data_root`) and the configs root (`root`) and writes the answers back to this file, via scripts/set_common_path.py.
# The encodings are under data_root. The demo file paths (META, MSA_DEDUP, TREE_DEDUP, PCA_BASIS) are read by
# scripts/print_common_paths.py.

